<!--
  Fixture SINTETICO de la plantilla ANTIGUA, la del objetivo del enunciado, cuya
  tabla de resultados sigue sin capturarse porque su CAPTCHA de imagen la
  bloquea. Reproduce los marcadores que RichFaces 3.3 genera siempre.

  Lo que ejerce es el caso medido en la unica captura real comparable (TRF1):
  parte de las filas NO publican numero CNJ porque el expediente esta en segredo
  de justica. Alli eran 8 de cada 30 —el 27 % de la pagina—, y este parser las
  descartaba en silencio.

    - fila 1: numero CNJ + enlace a la ficha  -> registro normal
    - fila 2: SIN numero, con enlace `ca=`     -> se rescata, `enSigilo: true`,
                                                  clave derivada del `ca=`
    - fila 3: SIN numero y SIN enlace utilizable -> no hay clave posible; se
                                                  descarta, pero con aviso
-->
