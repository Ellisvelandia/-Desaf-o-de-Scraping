<!DOCTYPE html>
<html>
<head><title>Consulta Publica - estructura cambiada (fixture sintetico)</title></head>
<body>
<!--
  El escenario que este proyecto mas teme: el portal sigue sirviendo una
  `rich:dataTable` con filas, pero el numero de proceso ya no viene en formato
  CNJ (aqui, un identificador interno inventado).

  Un parser posicional seguiria "funcionando" y produciria registros con basura
  en el campo del numero. El de este proyecto debe lanzar
  `EstructuraInesperadaError`: una rotura ruidosa en vez de una silenciosa.
-->
<table class="rich-table" id="consultaPublicaForm:consultaPublicaList">
  <thead class="rich-table-thead">
    <tr class="rich-table-subheader">
      <th class="rich-table-subheadercell">Identificador</th>
      <th class="rich-table-subheadercell">Classe Judicial</th>
      <th class="rich-table-subheadercell">&Oacute;rg&atilde;o Julgador</th>
    </tr>
  </thead>
  <tbody id="consultaPublicaForm:consultaPublicaList:tb">
    <tr class="rich-table-row">
      <td class="rich-table-cell">PROC-2024-000001</td>
      <td class="rich-table-cell">PROCEDIMENTO COMUM C&Iacute;VEL</td>
      <td class="rich-table-cell">1&ordf; Vara Federal de Pernambuco</td>
    </tr>
    <tr class="rich-table-row">
      <td class="rich-table-cell">PROC-2024-000002</td>
      <td class="rich-table-cell">EXECU&Ccedil;&Atilde;O FISCAL</td>
      <td class="rich-table-cell">2&ordf; Vara Federal do Cear&aacute;</td>
    </tr>
    <tr class="rich-table-row">
      <td class="rich-table-cell">PROC-2024-000003</td>
      <td class="rich-table-cell">MANDADO DE SEGURAN&Ccedil;A C&Iacute;VEL</td>
      <td class="rich-table-cell">3&ordf; Vara Federal da Para&iacute;ba</td>
    </tr>
  </tbody>
</table>
</body>
</html>
