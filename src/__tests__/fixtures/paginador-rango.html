<!DOCTYPE html>
<html>
<head><title>Paginador con rango de registros (fixture sintetico)</title></head>
<body>
<!-- El `rich:datascroller` publicando un rango: "1 a 20 de 345" son registros. -->
<div class="rich-datascr" id="consultaPublicaForm:scroller">
  <table class="rich-datascr-table"><tbody><tr>
    <td class="rich-datascr-inact">1 a 20 de 345</td>
  </tr></tbody></table>
</div>
</body>
</html>
