<!DOCTYPE html>
<html>
<head><title>Paginador con contador de paginas (fixture sintetico)</title></head>
<body>
<!--
  El mismo `rich:datascroller` contando PAGINAS. "Pagina 3 de 10" no dice
  cuantos registros hay: leer ese 10 como total de resultados haria que la
  extraccion parase 335 procesos antes de tiempo.
-->
<div class="rich-datascr" id="consultaPublicaForm:scroller">
  <table class="rich-datascr-table"><tbody><tr>
    <td class="rich-datascr-inact">P&aacute;gina 3 de 10</td>
  </tr></tbody></table>
</div>
</body>
</html>
